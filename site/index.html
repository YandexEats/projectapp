<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Панель</title>
  <meta name="description" content="Панель">
  <meta property="og:title" content="Панель">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
  <!-- До входа на странице только форма. Остальное приходит зашифрованным (ui.json.enc) и показывается после ввода пароля. -->
  <div id="gate" class="gate wrap">
    <form id="login-form" class="card login" autocomplete="on" hidden>
      <h1 class="login-title">Панель</h1>
      <input id="pw" name="password" type="password" autocomplete="current-password" placeholder="Введите пароль" aria-label="Введите пароль" required>
      <label class="remember"><input type="checkbox" id="remember"> Запомнить на этом устройстве</label>
      <button type="submit" id="login-btn">Войти</button>
      <p id="login-error" class="login-error" role="alert" hidden>Неверный пароль</p>
    </form>
    <p id="gate-status" class="gate-status hint">Загрузка…</p>
  </div>
  <div id="app"></div>
  <script src="app.js"></script>
</body>
</html>
