name: Публикация дашборда

# Перепубликует дашборд, когда меняется его код (site/) вручную.
# Данные публикует сам workflow мониторинга после каждой проверки.
on:
  push:
    branches: [main]
    paths: ["site/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: tezkor-monitor
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Сборка
        run: |
          mkdir -p _site
          cp -r site/. _site/
          if [ -d data ]; then cp -r data _site/data; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
