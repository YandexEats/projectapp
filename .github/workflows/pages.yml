name: Публикация дашборда

# Перепубликует дашборд, когда меняется его код вручную.
# Данные публикует сам workflow мониторинга после каждой проверки.
# Публикуются только зашифрованные файлы (*.json.enc), см. monitor/build_site.py.
on:
  push:
    branches: [main]
    paths: ["site/**", "monitor/build_site.py", "monitor/vault.py", "monitor/testdata.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: tezkor-monitor
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      GROUP_CHAT_ID: ${{ secrets.GROUP_CHAT_ID }}
      ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
      DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Зависимости (шифрование)
        run: pip install --quiet -r requirements.txt
      - name: Проверка пароля дашборда
        run: python monitor/vault.py require-password
      - name: Сборка
        run: python monitor/build_site.py _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
